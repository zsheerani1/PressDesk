{% extends "card.html" %}

{% block heading %}{{ heading }}{% endblock %}

{% block intro %}
  <p>{{ message }}</p>
  <p><strong>This cannot be undone.</strong></p>
{% endblock %}

{# Posts back to this same address to confirm the delete. #}
{% block form %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <button type="submit" class="button button-primary full-width">Yes, delete it</button>
  </form>
{% endblock %}

{% block footer %}<a href="{{ cancel_url }}">No, keep it</a>{% endblock %}
